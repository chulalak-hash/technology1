<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --pink:#ff4f9a; --pink2:#ff86bd; --pink3:#ffc2dd; --pink-bg:#fff2f8;
  --violet:#8b5cf6; --cyan:#22c3e6; --mint:#2fd3a0; --amber:#ffb547;
  --ink:#3b2140; --ink2:#7a5a80; --line:#f6d3e5; --card:#ffffff;
  --shadow:0 10px 30px rgba(255,79,154,.14); --r:22px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff6fb 0%,#fdeefe 55%,#eef6ff 100%);min-height:100vh;font-size:16px}
h1,h2,h3,h4,.kanit{font-family:'Kanit',sans-serif;font-weight:600;margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;display:inline-block;font-size:24px;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;vertical-align:middle}
a{color:var(--pink)}
button{font-family:'Kanit',sans-serif;cursor:pointer}
input,textarea,select{font-family:'Sarabun',sans-serif;font-size:16px}

/* พื้นหลังไอคอนเทคโนโลยีลอยไปมา */
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg .ms{position:absolute;color:var(--pink);opacity:.09;animation:float 14s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(12deg)}}
#app{position:relative;z-index:1}

/* ปุ่ม/ฟอร์ม */
.btn{border:0;border-radius:999px;padding:12px 22px;font-size:16px;font-weight:500;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:.18s}
.btn-pink{background:linear-gradient(135deg,var(--pink),#ff6fb0);color:#fff;box-shadow:0 8px 18px rgba(255,79,154,.35)}
.btn-pink:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(255,79,154,.4)}
.btn-ghost{background:#fff;color:var(--pink);border:2px solid var(--pink3)}
.btn-ghost:hover{background:var(--pink-bg)}
.btn-sm{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.field{margin-bottom:14px}
.field label{display:block;font-family:'Kanit';font-weight:500;font-size:14px;color:var(--ink2);margin-bottom:6px}
.input{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;color:var(--ink);outline:none;transition:.15s}
.input:focus{border-color:var(--pink2);box-shadow:0 0 0 4px rgba(255,134,189,.18)}
textarea.input{min-height:110px;resize:vertical}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid #fde3ef}
.muted{color:var(--ink2)}
.small{font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:13px;font-family:'Kanit';font-weight:500;white-space:nowrap}
.chip .ms{font-size:16px}
.c-ok{background:#dcfbef;color:#0f8a63}.c-wait{background:#fff1d6;color:#b26b00}.c-no{background:#f3eef5;color:#9a86a0}.c-info{background:#e6f6fd;color:#0b84a5}.c-pink{background:var(--pink-bg);color:var(--pink)}

/* ===== หน้าเข้าสู่ระบบ ===== */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;max-width:1120px;margin:0 auto;padding:30px 22px}
.hero{background:linear-gradient(140deg,#ff4f9a 0%,#ff7eb8 45%,#b67cff 100%);color:#fff;border-radius:32px;padding:34px 30px;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(255,79,154,.3)}
.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.22) 1.4px,transparent 1.4px);background-size:22px 22px;opacity:.6}
.hero>*{position:relative}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.4)}
.brand-logo .ms{font-size:32px}
.hero h1{font-size:40px;line-height:1.05;letter-spacing:.3px}
.hero .sub{font-family:'Kanit';font-weight:400;opacity:.95;font-size:17px;margin-top:4px}
.orbit{position:relative;width:260px;height:260px;margin:22px auto 8px}
.orbit .ring{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(255,255,255,.55);animation:spin 40s linear infinite}
.orbit .ring .ms{position:absolute;background:#fff;color:var(--pink);border-radius:50%;padding:8px;font-size:22px;box-shadow:0 6px 14px rgba(0,0,0,.12)}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit .ring .ms{animation:spin 40s linear infinite reverse}
.orbit .photo{position:absolute;inset:26px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff 0%,#ffe1ef 70%);overflow:hidden;border:5px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(120,0,60,.25)}
.orbit .photo img{width:100%;height:118%;object-fit:cover;object-position:50% 0%}
.teacher-name{text-align:center;margin-top:10px}
.teacher-name h3{font-size:21px}
.teacher-name div{opacity:.92;font-size:15px}
.flow-mini{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.flow-mini span{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);padding:6px 12px;border-radius:999px;font-family:'Kanit';font-size:14px;display:inline-flex;gap:5px;align-items:center}
.flow-mini .ms{font-size:18px}

.login-card{padding:32px 28px}
.login-card h2{font-size:26px;color:var(--ink)}
.seg{display:flex;background:var(--pink-bg);border-radius:999px;padding:5px;margin:18px 0 22px}
.seg button{flex:1;border:0;background:transparent;padding:10px;border-radius:999px;font-size:15px;color:var(--ink2);display:flex;gap:6px;align-items:center;justify-content:center}
.seg button.on{background:#fff;color:var(--pink);box-shadow:0 4px 12px rgba(255,79,154,.18)}
.hint{background:#f2f0ff;color:#5b44b5;border-radius:14px;padding:10px 14px;font-size:14px;display:flex;gap:8px;align-items:flex-start;margin-top:16px}

/* ===== ส่วนหัว ===== */
.topbar{background:linear-gradient(120deg,#ff4f9a,#ff7eb8 60%,#b67cff);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 6px 20px rgba(255,79,154,.25)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.topbar .brand-logo{width:42px;height:42px;border-radius:13px}
.topbar .brand-logo .ms{font-size:26px}
.topbar h1{font-size:21px;line-height:1.1}
.topbar .sub{font-size:13px;opacity:.9;font-family:'Kanit';font-weight:400}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}
.who .meta{text-align:right;line-height:1.2}
.who .meta b{font-family:'Kanit';font-weight:500;font-size:15px;display:block}
.who .meta span{font-size:13px;opacity:.9}
.avatar{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;border:2px solid rgba(255,255,255,.6);overflow:hidden}
.avatar img{width:100%;height:125%;object-fit:cover;object-position:50% 0}
.icon-btn{border:0;background:rgba(255,255,255,.2);color:#fff;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.icon-btn:hover{background:rgba(255,255,255,.32)}

.page{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
.crumb{display:flex;align-items:center;gap:6px;font-family:'Kanit';font-size:14px;color:var(--ink2);margin-bottom:14px;flex-wrap:wrap}
.crumb a{cursor:pointer;text-decoration:none;color:var(--pink)}

/* หน้าแรกนักเรียน */
.welcome{display:grid;grid-template-columns:1fr auto;gap:20px;padding:24px;align-items:center;background:linear-gradient(135deg,#fff 0%,#fff5fa 100%)}
.welcome h2{font-size:26px}
.ring-prog{--p:0;width:116px;height:116px;border-radius:50%;background:conic-gradient(var(--pink) calc(var(--p)*1%),#ffe3f0 0);display:grid;place-items:center}
.ring-prog>div{width:88px;height:88px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-family:'Kanit'}
.ring-prog b{font-size:24px;color:var(--pink);display:block;line-height:1}
.ring-prog span{font-size:12px;color:var(--ink2)}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 26px}
.phase{padding:16px 18px;border-radius:20px;display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid #fde3ef}
.phase .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}
.phase h4{font-size:17px}
.phase p{margin:2px 0 0;font-size:14px;color:var(--ink2)}
.sec-title{display:flex;align-items:center;gap:10px;margin:8px 0 14px}
.sec-title h3{font-size:21px}
.sec-title .ms{color:var(--pink)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.unit{padding:20px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.unit:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(255,79,154,.22)}
.unit .uic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;margin-bottom:12px}
.unit .uic .ms{font-size:32px}
.unit .no{position:absolute;right:16px;top:12px;font-family:'Kanit';font-size:44px;font-weight:700;color:#ffe3f0}
.unit h4{font-size:18px;margin-bottom:4px}
.unit p{font-size:14px;color:var(--ink2);margin:0 0 14px;min-height:40px}
.bar{height:9px;background:#ffe9f3;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--violet));border-radius:99px;transition:width .6s}
.unit .foot{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:7px;font-family:'Kanit'}

.lessons{display:grid;gap:12px}
.lesson-row{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;transition:.18s}
.lesson-row:hover{transform:translateX(4px)}
.lesson-row .lno{width:48px;height:48px;border-radius:15px;background:var(--pink-bg);color:var(--pink);display:grid;place-items:center;font-family:'Kanit';font-weight:600;flex:none}
.lesson-row .grow{flex:1;min-width:0}
.lesson-row h4{font-size:17px}
.dots{display:flex;gap:5px;margin-top:6px}
.dots i{width:24px;height:7px;border-radius:9px;background:#f3e6ee}
.dots i.on{background:linear-gradient(90deg,var(--pink),var(--violet))}

/* หน้าบทเรียน */
.lesson-head{padding:22px 24px;display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#fff,#fff4fa)}
.lesson-head .uic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;color:#fff;flex:none}
.lesson-head .uic .ms{font-size:36px}
.lesson-head h2{font-size:24px}
.obj{margin-top:6px;font-size:15px;color:var(--ink2);display:flex;gap:6px}
.obj .ms{font-size:20px;color:var(--violet)}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0 6px;position:relative}
.step{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center;cursor:pointer;transition:.18s;position:relative}
.step .sic{width:44px;height:44px;border-radius:14px;margin:0 auto 6px;display:grid;place-items:center;background:#f6eef3;color:#b49bb9}
.step b{font-family:'Kanit';font-weight:500;font-size:14px;display:block;line-height:1.25}
.step small{font-size:12px;color:var(--ink2)}
.step.done .sic{background:#dcfbef;color:#0f8a63}
.step.active{border-color:var(--pink);box-shadow:0 8px 20px rgba(255,79,154,.2)}
.step.active .sic{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff}
.step.locked{opacity:.55}
.step .lock{position:absolute;top:8px;right:8px;font-size:16px;color:#b49bb9}
.phase-tags{display:grid;grid-template-columns:2fr 1fr 2fr;gap:8px;margin-bottom:16px}
.phase-tags div{text-align:center;font-family:'Kanit';font-size:13px;padding:5px;border-radius:10px}
.panel{padding:24px}
.panel h3{font-size:21px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.panel h3 .ms{color:var(--pink)}
.video{position:relative;padding-top:56.25%;border-radius:18px;overflow:hidden;background:#20122a;margin:14px 0}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{padding:26px;border:2px dashed var(--pink3);border-radius:18px;text-align:center;color:var(--ink2);margin:14px 0}
.empty .ms{font-size:40px;color:var(--pink2);display:block;margin-bottom:6px}
.q{padding:16px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.q h4{font-family:'Sarabun';font-weight:600;font-size:17px;margin-bottom:10px}
.q h4 span{color:var(--pink);font-family:'Kanit'}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;text-align:left;font-family:'Sarabun';font-size:16px;color:var(--ink);display:flex;gap:10px;align-items:center;transition:.15s}
.choice i{font-style:normal;width:30px;height:30px;border-radius:10px;background:var(--pink-bg);color:var(--pink);display:grid;place-items:center;font-family:'Kanit';flex:none}
.choice:hover{border-color:var(--pink2)}
.choice.sel{border-color:var(--pink);background:#fff4fa}
.choice.sel i{background:var(--pink);color:#fff}
.choice.right{border-color:#2fd3a0;background:#eafff7}
.choice.right i{background:#2fd3a0;color:#fff}
.choice.wrong{border-color:#ff8a8a;background:#fff1f1}
.result{display:flex;gap:16px;align-items:center;padding:18px;border-radius:18px;background:linear-gradient(135deg,#fff4fa,#f3efff);margin:12px 0}
.result .big{font-family:'Kanit';font-size:42px;font-weight:700;color:var(--pink);line-height:1}
.box{background:#fbf7ff;border-radius:16px;padding:14px 16px;margin:12px 0;border:1px solid #ece4ff}
.box b{font-family:'Kanit';font-weight:500;display:flex;gap:6px;align-items:center;color:var(--violet)}
.stars{display:flex;gap:8px;margin:8px 0 14px;flex-wrap:wrap}
.stars button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 12px;text-align:center;min-width:70px}
.stars button .ms{font-size:30px;color:#e4cfdb}
.stars button small{display:block;font-size:12px;color:var(--ink2);font-family:'Sarabun'}
.stars button.on{border-color:var(--amber);background:#fff9ec}
.stars button.on .ms{color:var(--amber)}
.row-end{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
.nav-lesson{display:flex;justify-content:space-between;margin-top:16px;gap:10px}

/* ===== ครู ===== */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px}
.tabs button{border:0;background:#fff;border:2px solid var(--line);color:var(--ink2);padding:10px 16px;border-radius:999px;font-size:15px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tabs button.on{background:linear-gradient(135deg,var(--pink),#ff6fb0);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(255,79,154,.3)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{padding:18px;display:flex;gap:14px;align-items:center}
.stat .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none}
.stat b{font-family:'Kanit';font-size:28px;line-height:1;display:block}
.stat span{font-size:14px;color:var(--ink2)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select{border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;color:var(--ink);min-width:160px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:15px}
.tbl th{background:var(--pink-bg);font-family:'Kanit';font-weight:500;color:var(--ink2);text-align:left;padding:10px 12px;font-size:14px;white-space:nowrap}
.tbl th:first-child{border-radius:12px 0 0 12px}.tbl th:last-child{border-radius:0 12px 12px 0}
.tbl td{padding:10px 12px;border-bottom:1px solid #fbe7f1;vertical-align:middle}
.tbl tr:hover td{background:#fffafd}
.pp{display:grid;gap:6px;min-width:180px}
.pp .l{display:flex;align-items:center;gap:8px;font-size:13px}
.pp .l span{width:58px;color:var(--ink2);font-family:'Kanit'}
.pp .t{flex:1;height:12px;background:#f6edf2;border-radius:9px;overflow:hidden}
.pp .t i{display:block;height:100%;border-radius:9px}
.gain{font-family:'Kanit';font-weight:600}
.legend{display:flex;gap:14px;font-size:14px;color:var(--ink2);margin-bottom:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.work-card{padding:16px 18px;display:grid;grid-template-columns:1fr 240px;gap:14px;align-items:center;margin-bottom:12px}
.grade{display:flex;gap:8px;align-items:center}
.grade input{width:80px}

/* modal / toast / loading */
.modal-bg{position:fixed;inset:0;background:rgba(59,33,64,.35);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:18px}
.modal{max-width:520px;width:100%;padding:24px;max-height:85vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-family:'Kanit';z-index:60;transition:.3s;display:flex;gap:8px;align-items:center;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#e2456b}
#loading{position:fixed;inset:0;background:rgba(255,246,251,.7);display:none;place-items:center;z-index:70}
#loading.show{display:grid}
.spin{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--pink),var(--violet));display:grid;place-items:center;color:#fff;animation:pulse 1s ease-in-out infinite}
.spin .ms{font-size:36px;animation:spin 1.6s linear infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.footer{text-align:center;color:var(--ink2);font-size:13px;padding:10px 0 26px}

@media (max-width:900px){
  .login-wrap{grid-template-columns:1fr;padding:16px}
  .hero h1{font-size:32px}
  .orbit{width:210px;height:210px}
  .phases{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .work-card{grid-template-columns:1fr}
}
@media (max-width:640px){
  .topbar h1{font-size:17px}.topbar .sub{display:none}
  .who .meta{display:none}
  .welcome{grid-template-columns:1fr;text-align:center}.welcome .ring-prog{margin:0 auto}
  .stepper{grid-template-columns:repeat(5,1fr);gap:4px}
  .step{padding:8px 2px;border-radius:14px}.step small{display:none}.step b{font-size:11px}
  .step .sic{width:36px;height:36px}
  .phase-tags div{font-size:11px}
  .choices{grid-template-columns:1fr}
  .panel{padding:18px}
  .lesson-head{flex-direction:column;text-align:center}
}
@media print{
  #bg,.topbar,.tabs,.filters button,.no-print{display:none!important}
  body{background:#fff}.card{box-shadow:none}
}

  body.printing > *:not(#printArea){display:none!important}
  body.printing #printArea{display:block;font-family:Sarabun,sans-serif;color:#000;font-size:15px}
  .exam-bar{position:static}
}
.pa-head{text-align:center;line-height:1.7;margin-bottom:14px}.pa-name{margin:8px 0}.pa-ins{margin-bottom:12px}
.pa-q{break-inside:avoid;margin-bottom:10px}.pa-c{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;padding-left:20px}
.pa-t{border-collapse:collapse;width:100%}.pa-t th,.pa-t td{border:1px solid #999;padding:4px 8px;text-align:center}
@media(max-width:640px){.bk-c,.pa-c{grid-template-columns:1fr}.exam-bar{top:56px;flex-wrap:wrap}}
.bb{font-weight:700;color:var(--violet)}
.tbl.fg td:nth-child(3){white-space:nowrap}
.pw-wrap{position:relative}.pw-wrap .input{padding-right:48px;width:100%}.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#c06a98;cursor:pointer;width:38px;height:38px;border-radius:12px;display:grid;place-items:center}.pw-eye:hover{background:#ffe7f2}
.pw-eye{overflow:hidden}

/* ===== แก้ไขคะแนน ===== */
.ed-wrap{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.ed-side{position:sticky;top:76px}.ed-list{max-height:60vh;overflow:auto;display:grid;gap:4px}
.ed-st{display:flex;gap:8px;align-items:center;text-align:left;border:0;background:#fff;padding:8px 10px;border-radius:12px;cursor:pointer;font:inherit;font-size:14px}
.ed-st i{font-style:normal;min-width:26px;height:26px;border-radius:9px;background:#ffe7f2;color:#ff4f9a;display:grid;place-items:center;font-size:12px;font-weight:700}
.ed-st:hover{background:#fff4f9}.ed-st.on{background:linear-gradient(135deg,#ff8fc2,#ff4f9a);color:#fff}.ed-st.on i{background:#fff}
.ed-g{display:flex;align-items:center;gap:6px;margin:16px 0 6px;color:#8b5cf6;font-family:Kanit,sans-serif}
.ed-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px dashed #fbd3e6;flex-wrap:wrap}
.ed-sc{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ed-in{width:74px!important;padding:6px 8px!important;text-align:center}
.ed-pct{font-size:12px;padding:2px 8px;border-radius:999px;background:linear-gradient(90deg,#d6f7e9 calc(var(--p)*1%),#ffe7f2 0);color:#3b1d3a}
.ed-del{color:#e2456b!important}
@media(max-width:820px){.ed-wrap{grid-template-columns:1fr}.ed-side{position:static}.ed-list{max-height:220px}}
/* ===== เกมใหม่ ===== */
.g-end{text-align:center;padding:20px 10px}
.ipo-sys{display:flex;align-items:center;gap:12px;justify-content:center;margin:6px 0 12px;flex-wrap:wrap}.ipo-sys b{font-size:22px}
.ipo-cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px;margin-bottom:14px}
.ipo-c{border:2px solid #fbd3e6;background:#fff;border-radius:14px;padding:10px 14px;font:inherit;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
.ipo-c.sel{border-color:#ff4f9a;transform:translateY(-4px) scale(1.04);background:#fff0f7}
.ipo-c.ok{border-color:transparent;background:#fff;box-shadow:none;cursor:default;font-size:14px;padding:6px 10px}
.ipo-boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ipo-b{border:2.5px dashed var(--c);border-radius:18px;min-height:150px;padding:8px;cursor:pointer;background:color-mix(in srgb,var(--c) 8%,#fff)}
.ipo-bh{display:flex;align-items:center;gap:6px;justify-content:center;font-family:Kanit,sans-serif;color:var(--c);margin-bottom:6px}
.ipo-in{display:grid;gap:6px}
.mg-case{text-align:center;background:linear-gradient(135deg,#fff7e6,#ffeef6);border-radius:20px;padding:18px;margin-bottom:14px}
.mg-case h3{font-size:22px;margin:8px 0 2px}
.mg-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mg-o{border:2px solid #fbd3e6;background:#fff;border-radius:18px;padding:14px 8px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.15s;box-shadow:var(--shadow)}
.mg-o span{font-size:40px}.mg-o:hover:not(:disabled){transform:translateY(-4px)}
.mg-o.ok{border-color:#2fbf71;background:#e8fbf1}.mg-o.bad{border-color:#e2456b;background:#ffecef}
.mg-f{margin-top:14px;padding:12px 16px;border-radius:14px}.mg-f.ok{background:#e8fbf1;color:#0f8a63}.mg-f.no{background:#fff1e6;color:#b45309}
.mt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:720px;margin:0 auto}
.mt-c{border:0;background:none;padding:0;height:110px;perspective:600px;cursor:pointer;font:inherit}
.mt-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mt-c.flip .mt-in{transform:rotateY(180deg)}
.mt-back,.mt-front{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;padding:6px;text-align:center;font-size:14px}
.mt-back{background:linear-gradient(135deg,#ff8fc2,#8b5cf6);color:#fff;font-size:34px;font-family:Kanit,sans-serif;box-shadow:var(--shadow)}
.mt-front{background:#fff;border:2px solid #fbd3e6;transform:rotateY(180deg)}.mt-front.tool{background:#fff7e6}
.mt-e{font-size:30px}.mt-c.got .mt-front{border-color:#2fbf71;background:#e8fbf1}
@media(max-width:640px){.ipo-boxes,.mg-opts{grid-template-columns:1fr 1fr}.mt-grid{grid-template-columns:repeat(4,1fr);gap:6px}.mt-c{height:92px}.mt-front{font-size:12px}.mt-e{font-size:24px}}
.games{grid-template-columns:1fr 1fr;gap:10px}
.game-c{padding:10px 12px;gap:10px;flex-direction:column;align-items:flex-start;position:relative}
.game-c .gi{width:56px;height:56px}
.game-c .small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px}
.game-c>.ms:last-child{position:absolute;right:10px;top:10px;font-size:26px!important;overflow:hidden;width:28px}
@media(max-width:900px){.news-games{grid-template-columns:1fr}}
/* ===== จัดการเนื้อหา ===== */
.ce-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ce-tabs button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:14px;display:inline-flex;gap:5px;align-items:center;color:var(--ink2)}
.ce-tabs button.on{background:#a8306f;color:#fff;border-color:#a8306f}
.ce-tabs .ms{font-size:19px}
.ce-bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.ce-bar .input{flex:1;min-width:200px}
.ce-list{display:grid;gap:8px}
.ce-row{display:flex;gap:12px;align-items:center;padding:12px 14px}
.ce-t{flex:1;min-width:0}.ce-sub{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink2);margin-top:3px}
.ce-act{display:flex;gap:6px;flex:none}
.ce-del{color:#e2456b!important;border-color:#ffd6d6!important}
.ce-form{max-height:62vh;overflow:auto;padding-right:6px}
.ce-chk{display:inline-flex;gap:6px;align-items:center;margin:0 14px 12px 0;font-size:14px}

/* ===== Showcase ===== */
.sc-hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:26px;margin-bottom:18px;background:linear-gradient(135deg,#7a1f5c,#a8306f 60%,#c2185b);color:#fff;border:0}
.sc-hero h2{font-size:32px;margin:2px 0 8px}.sc-hero p{opacity:.92;margin:0 0 14px;max-width:640px}.sc-hero .lbl{font-family:'Kanit';font-size:13px;color:#ffd1e6;letter-spacing:1px}
.sc-hero-art{display:flex;align-items:flex-end}
.sc-top{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.sc-topc{padding:14px;display:grid;gap:4px;cursor:pointer}.sc-rk{font-size:28px}
.sc-filter{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}.sc-filter button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px}.sc-filter button.on{background:#a8306f;color:#fff;border-color:#a8306f}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:20px}
.sc-card{overflow:hidden;padding:0;display:flex;flex-direction:column}.sc-card.feat{outline:3px solid #f6b93b}
.sc-cov{position:relative;height:160px;background:linear-gradient(135deg,#fff0f7,#f3efff);cursor:pointer;display:grid;place-items:center;overflow:hidden}
.sc-cov img{width:100%;height:100%;object-fit:cover}
.sc-badge{position:absolute;left:10px;top:10px;background:#f6b93b;color:#3b2a00;font-family:'Kanit';font-size:12px;padding:3px 10px;border-radius:99px}.sc-badge.wait{left:auto;right:10px;background:#fff;color:#a8306f}
.sc-b{padding:12px 14px;display:grid;gap:6px;flex:1}.sc-b>b{cursor:pointer;font-size:17px}
.sc-f{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.sc-like{border:1.5px solid #ffd6e0;background:#fff;border-radius:99px;padding:5px 12px;font-family:'Kanit';cursor:pointer}.sc-like.on{background:#fff0f4}.sc-like:disabled{cursor:default;opacity:.8}
.sc-mcov{height:220px;border-radius:14px;overflow:hidden;margin-bottom:12px;background:#fff0f7;display:grid;place-items:center}.sc-mcov img{width:100%;height:100%;object-fit:cover}
.sc-sec{margin:10px 0}.sc-sec b{display:flex;gap:6px;align-items:center;color:#a8306f}

/* ===== XP / ตารางผู้นำ ===== */
.xp-card{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:18px 20px;margin-bottom:16px;background:linear-gradient(135deg,#8e2366,#a8306f 60%,#c2185b);color:#fff;border:0}
.xp-emo{font-size:46px;width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.xp-card .lbl{font-family:'Kanit';font-size:13px;color:#ffd1e6}.xp-card h3{font-size:22px;margin:2px 0 8px}.xp-card .muted{color:#ffe0ef!important}
.xp-bar{height:10px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-bottom:4px}.xp-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd1e6,#ffe066);border-radius:99px}
.xp-r{display:flex;flex-direction:column;gap:6px;align-items:stretch}.xp-rank{text-align:center}.xp-rank b{font-family:'Kanit';font-size:30px;display:block;line-height:1}.xp-rank span{font-size:12px;opacity:.85}
.panel .xp-bar{background:#fbe3ef}
.lb{display:grid;gap:4px}
.lb-r{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px}.lb-r:nth-child(odd){background:#fff7fb}.lb-r.me{background:#ffe4f1;outline:2px solid #ff4f9a}
.lb-n{width:30px;text-align:center;font-family:'Kanit';font-size:18px}.lb-name{flex:1;min-width:0}.lb-lv{font-size:13px;color:var(--ink2);white-space:nowrap}.lb-r b{font-family:'Kanit';min-width:44px;text-align:right}
.lv-row{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}.lv-row span:first-child{font-size:22px}.lv-row b{flex:1}
@media(max-width:700px){.sc-hero,.xp-card{grid-template-columns:1fr}.sc-hero-art{display:none}.sc-top{grid-template-columns:1fr}.ce-row{flex-wrap:wrap}}

/* ===== เลือกบทเรียน (หน้าแรกนักเรียน) ===== */
.pick{display:grid;gap:14px;margin-bottom:22px}
.pick-u{padding:0;overflow:hidden}
.pick-h{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff}
.pick-no{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-family:'Kanit';font-size:20px;flex:none}
.pick-ht{flex:1;min-width:0}.pick-ht .lbl{font-size:12px;opacity:.9}.pick-ht b{font-size:18px}
.pick-pct{font-family:'Kanit';font-size:18px;background:rgba(255,255,255,.2);padding:2px 10px;border-radius:99px}
.pick-all{border:0;background:#fff;color:#a8306f;border-radius:10px;padding:6px 10px;font-size:13px;display:inline-flex;gap:4px;align-items:center;cursor:pointer}.pick-all .ms{font-size:18px}
.pick-ls{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:14px}
.pick-l{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px;cursor:pointer;transition:.15s;font:inherit;color:inherit}
.pick-l:hover{transform:translateY(-2px);border-color:#8b5cf6;box-shadow:0 8px 18px rgba(255,79,154,.15)}
.pl-art{flex:none;width:52px;height:52px;border-radius:12px;background:#fff0f7;display:grid;place-items:center;overflow:hidden}
.pl-b{display:grid;gap:2px;min-width:0}.pl-id{font-family:'Kanit';font-size:12px;color:#8b5cf6}.pl-t{font-family:'Kanit';font-size:15px;line-height:1.3}
.pl-s{font-size:12px;color:var(--ink2);display:inline-flex;gap:3px;align-items:center}.pl-s .ms{font-size:16px}
.pick-l.done{background:#f0fbf5;border-color:#ffc2dd}.pick-l.done .pl-s{color:#ff4f9a}
.pick-l.doing{border-color:#ffd38a}.pick-l.doing .pl-s{color:#c27c0e}
@media(max-width:600px){.pick-all{display:none}.pick-ls{grid-template-columns:1fr}}

/* ===== เมนูครูแบบแถบด้านซ้าย ===== */
.tlayout{display:grid;grid-template-columns:268px 1fr;gap:22px;max-width:1480px;margin:0 auto;padding:20px 18px 60px;align-items:start}
.tside{position:sticky;top:88px;max-height:calc(100vh - 104px);overflow:auto;background:#fff;border:1px solid #f6d3e5;border-radius:18px;padding:12px;box-shadow:0 10px 30px rgba(122,31,92,.08)}
.tside::-webkit-scrollbar{width:6px}.tside::-webkit-scrollbar-thumb{background:#f6d3e5;border-radius:9px}
.ts-me{display:flex;gap:10px;align-items:center;padding:10px 10px 14px;border-bottom:1px solid #fbe3ef;margin-bottom:6px}
.ts-av{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#a8306f,#8b5cf6);color:#fff;display:grid;place-items:center;flex:none}
.ts-me b{display:block;font-size:16px}.ts-me span{font-size:12px;color:var(--ink2)}
.ts-g{padding:6px 0}.ts-gt{font-size:11.5px;font-weight:700;letter-spacing:.6px;color:#b08aa0;text-transform:uppercase;padding:8px 12px 4px}
.ts-i{width:100%;display:flex;gap:12px;align-items:center;border:0;background:transparent;padding:9px 12px;border-radius:10px;font:inherit;font-size:14.5px;color:var(--ink2);cursor:pointer;text-align:left;position:relative}
.ts-i .ms{font-size:20px;width:22px;flex:none;color:#b0578a;text-align:center}.ts-i>span:not(.ms){flex:1;min-width:0;line-height:1.35}
.ts-i:hover{background:#fff2f8;color:var(--ink)}
.ts-i.on{background:linear-gradient(135deg,#a8306f,#d63b86);color:#fff;box-shadow:0 6px 14px rgba(168,48,111,.25)}.ts-i.on .ms{color:#ffd1e6}
.ts-i em{font-style:normal;font-size:12px;background:#ff6b6b;color:#fff;border-radius:99px;padding:1px 8px}
.tmain{min-width:0}
body:has(.tlayout) .topbar-in{max-width:1480px}
.stat .ic .ms{font-size:28px!important;color:#fff!important}
.tm-h{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #f6d3e5}
.tm-t{display:flex;align-items:center;gap:10px;flex:1;min-width:0}.tm-t .ms{font-size:28px;color:#d63b86}.tm-t h2{margin:0;font-size:24px}
.ts-tg{display:none;border:1px solid #f6d3e5;background:#fff;border-radius:10px;width:42px;height:42px;cursor:pointer}
.ts-ov{display:none}
@media(max-width:960px){
  .tlayout{grid-template-columns:1fr;padding-top:14px}
  .tside{position:fixed;left:0;top:0;bottom:0;width:286px;max-height:none;border-radius:0 18px 18px 0;z-index:200;transform:translateX(-105%);transition:transform .25s}
  .tside.open{transform:none}
  .ts-ov.on{display:block;position:fixed;inset:0;background:rgba(60,10,40,.4);z-index:150}
  .ts-tg{display:grid;place-items:center}
  .tm-t h2{font-size:19px}
}

/* ===== เสียงอ่าน ===== */
.tts-fab{position:fixed;left:18px;bottom:18px;z-index:31;border:0;border-radius:999px;padding:11px 16px;background:#fff;color:#a8306f;font:inherit;font-size:15px;display:flex;gap:6px;align-items:center;box-shadow:0 10px 24px rgba(122,31,92,.22);border:2px solid #ffc2dd;cursor:pointer}
.tts-fab.on{background:linear-gradient(135deg,#f6b93b,#ff9f43);color:#3b2500;border-color:transparent}
.tts-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:30;display:flex;gap:8px;align-items:center;background:#8e2366;color:#fff;padding:8px 10px 8px 14px;border-radius:999px;box-shadow:0 12px 30px rgba(122,31,92,.35)}
.tts-bar button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;display:flex;gap:5px;align-items:center;cursor:pointer}
.tts-bar #ttsPlay{background:#ffd1e6;color:#7a1f5c;font-weight:600}
.tts-hint{font-size:13px;opacity:.9;display:flex;gap:4px;align-items:center}
.tts-hl{background:#fff4c2!important;outline:3px solid #ffd34d;border-radius:8px;transition:background .2s}
@media(max-width:640px){.tts-fab span,.tts-hint{display:none}.tts-fab{padding:12px}.tts-bar{bottom:76px}}
.curr{margin:14px 0 4px;padding:0;overflow:hidden}
.curr summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 18px;color:var(--ink)}
.curr summary::-webkit-details-marker{display:none}
.curr summary .ms{color:var(--violet)}
.curr[open] summary>.ms:last-child{transform:rotate(180deg)}
.curr-b{padding:0 18px 16px;display:grid;gap:8px}
.curr-k{font-family:'Kanit';font-weight:600;color:var(--pink);margin-top:6px}
.curr-i{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.curr-i .chip{white-space:nowrap}
.curr-o{display:grid;gap:2px;background:var(--pink-bg);border-radius:14px;padding:10px 14px;font-size:15px}
.curr-tbl td{vertical-align:top}
.curr-obj div{margin-bottom:4px;font-size:14px}
.curr-obj b{display:inline-block;min-width:16px;color:var(--pink)}
.curr-exam td{background:#fff7e6}
.curr-ratio{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 14px}
.curr-ratio div{background:var(--pink-bg);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column}
.curr-ratio span{font-size:14px;color:var(--ink2)}
.curr-ratio b{font-family:'Kanit';font-size:26px;color:var(--pink)}
@media print{.curr-tbl{font-size:12px}}
.curr-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.std{margin-top:8px}
.std-chips{display:flex;flex-wrap:wrap;gap:6px}
.std-d{margin-top:8px;background:#fff6fb;border:1px solid #fbe1ee;border-radius:14px;padding:4px 12px}
.std-d summary{cursor:pointer;font-family:'Kanit';font-size:14px;color:var(--pink);display:flex;align-items:center;gap:4px;padding:6px 0;list-style:none}
.std-d summary::-webkit-details-marker{display:none}
.std-d[open] summary .ms{transform:rotate(180deg)}
.std-b{padding:4px 0 10px;text-align:left}
.std-b>b{display:block;margin:10px 0 4px;font-size:15px}
.kpa{list-style:none;margin:4px 0;padding:0;display:grid;gap:6px}
.kpa li{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.5}
.kpa li small{display:block;color:var(--ink2);font-size:12px}
.kpa-t{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:#fff;font-family:'Kanit';font-size:13px}
.kpa-K{background:#ff4f9a}
.kpa-P{background:#8b5cf6}
.kpa-A{background:#ff9f43}
/* ===== FLIP Candy Quest 3D ===== */
body.q-on{overflow:hidden}
body.q-on .fab,body.q-on #ttsBar{display:none!important}
#quest{position:fixed;inset:0;z-index:200;background:#ffe0f0;user-select:none;-webkit-user-select:none;touch-action:none;font-family:'Kanit',sans-serif}
#qgl,#qov{position:absolute;left:0;top:0}
#qov{touch-action:none}

/* ===================== หน้าบทเรียน ===================== */
function stepDone(p,k){ if(!p) return false; if(k==='pre'||k==='post') return p[k]!==null; if(k==='R') return !!p.reflect; return !!p[k]; }
function stepNA(L,k){ return (k==='pre'&&!L.preCount)||(k==='post'&&!L.postCount); }
function stepLocked(p,k){
  if(!p) return false;
  if(k==='F') return p.pre===null;
  if(k==='L') return !p.F;
  if(k==='post') return !p.L;
  if(k==='R') return p.post===null;
  return false;
}
function openLesson(id){
  store('tfl_back',null);
  return loadHome().then(function(){ return isStudent()? call('getLesson',S.token,id) : call('getPublicLesson',id); }).then(function(r){
    if(r.progress){ r.preCount=r.pre.length; r.postCount=r.post.length; }
    S.lesson=r; S.answers={}; S.rating=0; S.retry=false;
    var p=r.progress, first=0;
    if(p){ for(var i=0;i<STEPS.length;i++){ if(!stepDone(p,STEPS[i].k) && !stepLocked(p,STEPS[i].k)){ first=i; break; } } }
    else first = r.preCount?1:1;
    S.step=first; renderLesson();
  }).catch(function(){});
}
function renderLesson(){
  var L=S.lesson, l=L.lesson, p=L.progress, idx=unitIdx(l.unitId);
  var steps=STEPS.map(function(s,i){
    var d=stepDone(p,s.k), lk=stepLocked(p,s.k), na=stepNA(L,s.k);
    return '<div class="step '+(d?'done ':'')+(i===S.step?'active ':'')+(lk?'locked':'')+'" onclick="pickStep('+i+')"><span class="letter">'+s.g+'</span>'+
      (lk?'<span class="ms lock">lock</span>':'')+'<div class="sic">'+ic(d?'check':s.i)+'</div><b>'+s.t+'</b><small>'+(na?'ไม่มีในบทนี้':FLIP_WHERE[s.g].split(' · ').pop())+'</small></div>';
  }).join('');
  var allL=S.home.lessons, pos=-1; allL.forEach(function(x,i){ if(String(x.lessonId)===String(l.lessonId)) pos=i; });
  var prev=allL[pos-1], nxt=allL[pos+1];
  $('#app').innerHTML = topbar()+'<div class="page">'+
    '<div class="crumb"><a onclick="go(\'\')">'+ic('home','font-size:18px')+' หน้าแรก</a>'+ic('chevron_right','font-size:18px')+
      '<a onclick="go(\'unit/'+encodeURIComponent(l.unitId)+'\')">หน่วยที่ '+(idx+1)+(L.unit?' '+esc(L.unit.title):'')+'</a>'+ic('chevron_right','font-size:18px')+'<span>'+esc(l.lessonId)+'</span></div>'+
    '<div class="card lesson-head"><div class="uic kwbox" style="'+grad(UNIT_COLORS[idx%6])+'">'+kawaii(lessonArt(l.lessonId)[0],58)+'</div><div>'+
      '<div class="muted kanit small">บทเรียน '+esc(l.lessonId)+(p?' · ทำแล้ว '+p.done+'/'+p.total+' ขั้น':'')+'</div><h2>'+esc(l.title)+'</h2>'+
      currBox(l)+'</div></div>'+

/* ย่อรูปจากมือถือให้เล็กลงก่อนอัปโหลด */
function readFile(file){
  return new Promise(function(res,rej){
    if(file.size>20*1024*1024){ rej('ไฟล์ใหญ่เกิน 20 MB กรุณาใช้ลิงก์แทน'); return; }
    var fr=new FileReader();
    fr.onerror=function(){ rej('อ่านไฟล์ไม่สำเร็จ'); };
    fr.onload=function(){
      var data=fr.result;
      if(/^image\/(jpeg|png|webp)/.test(file.type) && file.size>1.2*1024*1024){
        var img=new Image(); img.onload=function(){
          var sc=Math.min(1,1600/Math.max(img.width,img.height)), c=document.createElement('canvas');
          c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          res({name:file.name.replace(/\.\w+$/,'')+'.jpg',mime:'image/jpeg',b64:c.toDataURL('image/jpeg',0.82).split(',')[1]});
        }; img.onerror=function(){ res({name:file.name,mime:file.type,b64:data.split(',')[1]}); }; img.src=data;
      } else res({name:file.name,mime:file.type||'application/octet-stream',b64:data.split(',')[1]});
    };
    fr.readAsDataURL(file);
  });
}
function saveStepUI(k){

  var p0 = file ? (loading(true), readFile(file).then(function(f){ return call('uploadFile',S.token,id,k,f.name,f.mime,f.b64); }).then(function(r){ return {link:r.url,name:r.name}; }))
                : Promise.resolve({link:link,name:keepPrev?(L.progress[k].fileName||''):''});
  p0.then(function(up){
    return call('saveStep',S.token,id,k,text,up.link,up.name).then(function(){
      L.progress[k]={text:text,link:up.link,fileName:up.name,time:new Date().toISOString()};

var ST={

  betacf:function(a,b,x){ var m,m2,aa,c=1,d=1-(a+b)*x/(a+1),del,h,qab=a+b,qap=a+1,qam=a-1; if(Math.abs(d)<1e-30)d=1e-30; d=1/d; h=d;

      aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2)); d=1+aa*d; if(Math.abs(d)<1e-30)d=1e-30; c=1+aa/c; if(Math.abs(c)<1e-30)c=1e-30; d=1/d; del=d*c; h*=del; if(Math.abs(del-1)<3e-12) break; } return h; },
  gammaln:function(x){ var c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5],y=x,t=x+5.5; t-=(x+0.5)*Math.log(t); var s=1.000000000190015; for(var j=0;j<6;j++) s+=c[j]/++y; return -t+Math.log(2.5066282746310005*s/x); },
  ibeta:function(x,a,b){ if(x<=0) return 0; if(x>=1) return 1; var bt=Math.exp(ST.gammaln(a+b)-ST.gammaln(a)-ST.gammaln(b)+a*Math.log(x)+b*Math.log(1-x));
    return x<(a+1)/(a+b+2)? bt*ST.betacf(a,b,x)/a : 1-bt*ST.betacf(b,a,1-x)/b; },
  pT:function(t,df){ return ST.ibeta(df/(df+t*t),df/2,0.5); }, // สองหาง
  paired:function(pre,post){ var d=pre.map(function(x,i){return post[i]-x;}), n=d.length; if(n<2) return null;

};
function f2(x){ return (x==null||isNaN(x))?'-':(Math.round(x*100)/100).toFixed(2); }
function pTxt(p){ return p==null||isNaN(p)?'-':p<.001?'< .001':p.toFixed(3).replace(/^0/,''); }
function lvl5(m){ return isNaN(m)?'-':m>=4.51?'มากที่สุด':m>=3.51?'มาก':m>=2.51?'ปานกลาง':m>=1.51?'น้อย':'น้อยที่สุด'; }

function effTxt(d){ d=Math.abs(d); return isNaN(d)?'-':d>=.8?'ขนาดใหญ่':d>=.5?'ขนาดกลาง':d>=.2?'ขนาดเล็ก':'น้อยมาก'; }

function itemAnalysis(R,sel,inRoom){
  var keys, recs;
  if(sel==='skill-pre'){ keys=R.skill.keys; recs=R.skill.pre; }
  else if(sel==='skill-post'){ keys=R.skill.keys; recs=R.skill.post; }
  else { var l=R.lessons.filter(function(x){return 'L|'+x.lessonId===sel;})[0]; keys=l?l.preKeys:[]; recs=l?l.pre:[]; }
  recs=recs.filter(function(r){return inRoom(r.id);});
  var k=keys.length, M=recs.map(function(r){ return keys.map(function(key,i){ return Number(r.ans[i])===key?1:0; }); });
  var tot=M.map(function(r){ return r.reduce(function(a,b){return a+b;},0); });
  var n=M.length, g=Math.max(1,Math.round(n*0.27));
  var order=tot.map(function(t,i){return [t,i];}).sort(function(a,b){return b[0]-a[0];});
  var hi=order.slice(0,g).map(function(x){return x[1];}), lo=order.slice(-g).map(function(x){return x[1];});
  var items=keys.map(function(_,i){ var p=n?M.reduce(function(s,r){return s+r[i];},0)/n:NaN;
    var ru=hi.reduce(function(s,j){return s+M[j][i];},0), rl=lo.reduce(function(s,j){return s+M[j][i];},0); return {p:p,r:n>=2?(ru-rl)/g:NaN}; });
  var vt=n?ST.varp(tot):NaN, spq=items.reduce(function(s,it){return s+it.p*(1-it.p);},0);
  var kr=(k>1&&vt>0)?(k/(k-1))*(1-spq/vt):NaN;
  return {n:n,items:items,kr20:kr};
}

var _ac; function beep(f,ms,type){ try{ _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); var o=_ac.createOscillator(),g=_ac.createGain(); o.type=type||'square'; o.frequency.value=f; g.gain.value=.06; o.connect(g); g.connect(_ac.destination); o.start(); o.stop(_ac.currentTime+(ms||150)/1000); }catch(e){} }

    '<div class="wheel-wrap"><div class="pointer">▼</div><canvas id="pkC" width="460" height="460"></canvas><button class="btn btn-pink spin-b" id="pkS">'+ic('casino')+' หมุน!</button></div>'+
    '<div class="pk-res" id="pkO"></div><div class="small muted" id="pkI"></div>');
  var load=function(){
    if(teacher){ call('getRoomNames',S.token,$('#pkR').value).then(function(l){ PK.items=l.map(function(x){ return (x.no?x.no+'. ':'')+x.name; }); drawWheel(); }).catch(function(){}); }
    else { var n=Math.max(2,Math.min(60,Number($('#pkN').value)||34)); PK.items=[]; for(var i=1;i<=n;i++) PK.items.push('เลขที่ '+i); drawWheel(); }
  };
  $('#pkL').onclick=load; $('#pkS').onclick=spinWheel; load();
}
function drawWheel(){
  var c=$('#pkC'); if(!c) return; var x=c.getContext('2d'), n=PK.items.length, R=225;
  x.clearRect(0,0,460,460); $('#pkI').textContent='เหลือ '+n+' คน';
  if(!n){ x.font='20px Kanit'; x.textAlign='center'; x.fillText('เรียกครบทุกคนแล้ว 🎉',230,230); return; }
  for(var i=0;i<n;i++){ var a0=PK.angle+i*2*Math.PI/n, a1=a0+2*Math.PI/n;
    x.beginPath(); x.moveTo(230,230); x.arc(230,230,R,a0,a1); x.fillStyle=UNIT_COLORS[i%6][i%2]; x.fill(); x.strokeStyle='#fff'; x.lineWidth=2; x.stroke();
    x.save(); x.translate(230,230); x.rotate(a0+Math.PI/n); x.fillStyle='#fff'; x.font=(n>30?11:n>18?13:16)+'px Sarabun'; x.textAlign='right'; x.fillText(PK.items[i].slice(0,22),R-12,5); x.restore(); }
  x.beginPath(); x.arc(230,230,34,0,2*Math.PI); x.fillStyle='#fff'; x.fill(); x.font='28px serif'; x.textAlign='center'; x.fillText('🐻',230,240);
}
function spinWheel(){
  if(PK.spinning||!PK.items.length) return; PK.spinning=true; $('#pkO').innerHTML='';
  var start=PK.angle, total=Math.PI*2*(5+Math.random()*3), dur=4200, t0=performance.now(), lastTick=-1;
  (function step(t){ var k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); PK.angle=start+total*e; drawWheel();
    var n=PK.items.length, seg=Math.floor(((1.5*Math.PI-PK.angle)%(2*Math.PI)+4*Math.PI)%(2*Math.PI)/(2*Math.PI/n)); if(seg!==lastTick){ lastTick=seg; beep(700,25,'triangle'); }
    if(k<1) requestAnimationFrame(step);
    else { PK.spinning=false; var who=PK.items[seg]; $('#pkO').innerHTML='<div class="pk-win">🎉 '+esc(who)+'</div>'; confetti(); beep(880,180,'sine');
      if($('#pkX').checked) setTimeout(function(){ PK.items.splice(seg,1); drawWheel(); },1500); } })(t0);
}

/* ---------- 2) ห้องแล็บต่อวงจรไฟฟ้า ---------- */
var PARTS={
  empty:{n:'ว่าง (วงจรขาด)',e:'',sym:''}, wire:{n:'สายไฟ',e:'〰️'}, bat:{n:'ถ่านไฟฉาย 1.5V',e:'🔋'}, sw:{n:'สวิตช์',e:'🔘'},
  bulb:{n:'หลอดไฟ',e:'💡'}, led:{n:'LED',e:'🔴'}, res:{n:'ตัวต้านทาน',e:'▭'}, buz:{n:'บัซเซอร์',e:'🔔'}, mot:{n:'มอเตอร์',e:'⚙️'}
};
var CIR={slots:['bat','wire','empty','empty','wire','empty'],sw:{},sel:null};
var MISSIONS=[
  {t:'ทำให้หลอดไฟสว่าง',ok:function(r){return r.bulb;}},
  {t:'เปิด-ปิดหลอดไฟได้ด้วยสวิตช์',ok:function(r){return r.bulb&&r.hasSw;}},
  {t:'ทำให้ LED ติดโดยไม่ขาด',ok:function(r){return r.led;}},
  {t:'ไฟฉุกเฉินมีเสียง (LED + บัซเซอร์ + สวิตช์)',ok:function(r){return r.led&&r.buz&&r.hasSw;}},
  {t:'พัดลมจิ๋ว (มอเตอร์ + สวิตช์)',ok:function(r){return r.mot&&r.hasSw;}},
  {t:'หลอดไฟสว่างจ้าด้วยถ่าน 2 ก้อน',ok:function(r){return r.bulb&&r.bats>=2;}}
];
function evalCircuit(){
  var s=CIR.slots, r={bats:0,loads:0,hasSw:false,open:false,short:false,ledBurn:false,bulb:false,led:false,buz:false,mot:false,flow:false};
  s.forEach(function(p,i){ if(p==='empty') r.open=true; if(p==='bat') r.bats++; if(p==='sw'){ r.hasSw=true; if(!CIR.sw[i]) r.open=true; } if(['bulb','led','buz','mot','res'].indexOf(p)>-1) r.loads++; });
  if(r.open||!r.bats) return r;
  if(!r.loads){ r.short=true; return r; }
  var hasRes=s.indexOf('res')>-1, hasLed=s.indexOf('led')>-1;
  if(hasLed&&!hasRes){ r.ledBurn=true; return r; }
  r.flow=true; r.bulb=s.indexOf('bulb')>-1; r.led=hasLed; r.buz=s.indexOf('buz')>-1; r.mot=s.indexOf('mot')>-1;
  r.bright=Math.min(1,0.35+0.35*r.bats-0.12*(r.loads-1)); return r;
}
function gCircuit(){
  var pal=Object.keys(PARTS).map(function(k){ return '<button class="part" data-p="'+k+'"><span>'+(PARTS[k].e||'✂️')+'</span><small>'+PARTS[k].n+'</small></button>'; }).join('');
  $('#app').innerHTML=gamePage('ห้องแล็บต่อวงจรไฟฟ้า','electrical_services',
    botSays('<b>ช่วยหนูหลอดไฟให้สว่างหน่อย!</b> ต่อวงจรให้ครบรอบ แล้วเปิดสวิตช์นะ 💡','bulb')+'<div class="small muted">1) กดช่องในวงจร 2) เลือกอุปกรณ์ที่จะวาง · กดสวิตช์ในวงจรเพื่อเปิด-ปิด · LED ต้องมีตัวต้านทานเสมอ ไม่งั้นจะขาด!</div>'+
    '<div class="cir-grid"><div><div id="cirSvg"></div><div id="cirMsg" class="cir-msg"></div></div>'+
    '<div><div class="parts">'+pal+'</div><h4 class="kanit" style="margin:14px 0 6px">'+ic('flag','color:var(--pink)')+' ภารกิจ</h4><div id="cirMis"></div>'+
    '<div class="row-end"><button class="btn btn-ghost btn-sm" id="cirClr">'+ic('restart_alt')+' ล้างวงจร</button></div></div></div>');
  document.querySelectorAll('.part').forEach(function(b){ b.onclick=function(){ if(CIR.sel==null){ toast('กดเลือกช่องในวงจรก่อนนะ',true); return; } CIR.slots[CIR.sel]=b.dataset.p; CIR.sw[CIR.sel]=false; drawCircuit(); }; });
  $('#cirClr').onclick=function(){ CIR.slots=['bat','wire','empty','empty','wire','empty']; CIR.sw={}; CIR.sel=null; drawCircuit(); };
  drawCircuit();
}
function drawCircuit(){
  var r=evalCircuit(), P=[[90,60],[250,60],[410,60],[410,280],[250,280],[90,280]];
  var wire=r.flow?'#ffb547':'#b9a7c2', anim=r.flow?' class="flow"':'';

    '<rect x="90" y="60" width="320" height="220" rx="18" fill="none" stroke="'+wire+'" stroke-width="8"'+anim+'/>';
  CIR.slots.forEach(function(p,i){ var x=P[i][0],y=P[i][1], sel=CIR.sel===i;
    var face=PARTS[p].e, extra='';
    if(p==='bulb'&&r.bulb) extra='<circle cx="'+x+'" cy="'+y+'" r="'+(36+30*r.bright)+'" fill="#ffe066" opacity="'+(0.25+0.45*r.bright)+'" class="glow"/>';
    if(p==='led'&&r.led) extra='<circle cx="'+x+'" cy="'+y+'" r="44" fill="#ff4d6d" opacity=".35" class="glow"/>';
    if(p==='led'&&r.ledBurn){ face='💥'; }

    if(p==='bat'){ h+='<g class="slot'+(sel?' sel':'')+'" data-i="'+i+'"><rect x="'+(x-38)+'" y="'+(y-30)+'" width="76" height="60" rx="14" fill="#fff7fb" stroke="'+(sel?'#ff4f9a':'#ffc2dd')+'" stroke-width="3"/><g transform="translate('+(x-26)+','+(y-28)+') scale(.52)">'+ART.battery()+'</g><text x="'+x+'" y="'+(y+48)+'" text-anchor="middle" font-size="12" fill="#7a5a80" font-family="Sarabun">ถ่านไฟฉาย</text></g>'; return; }
    if(p==='sw') face=CIR.sw[i]?'🟢':'⭕';
    h+=extra+'<g class="slot'+(sel?' sel':'')+'" data-i="'+i+'"><rect x="'+(x-38)+'" y="'+(y-30)+'" width="76" height="60" rx="14" fill="'+(p==='empty'?'#fff':'#fff7fb')+'" stroke="'+(sel?'#ff4f9a':p==='empty'?'#d9c7e0':'#ffc2dd')+'" stroke-width="3" stroke-dasharray="'+(p==='empty'?'6 5':'0')+'"/>'+
      '<text x="'+x+'" y="'+(y+10)+'" text-anchor="middle" font-size="28"'+(p==='mot'&&r.mot?' class="spinme" style="transform-origin:'+x+'px '+y+'px"':'')+'>'+(face||'＋')+'</text>'+
      '<text x="'+x+'" y="'+(y+48)+'" text-anchor="middle" font-size="12" fill="#7a5a80" font-family="Sarabun">'+PARTS[p].n+'</text></g>';
  });
  h+='</svg>';
  $('#cirSvg').innerHTML=h;
  document.querySelectorAll('.slot').forEach(function(g){ g.onclick=function(){ var i=+g.dataset.i; if(CIR.slots[i]==='sw'&&CIR.sel===i){ CIR.sw[i]=!CIR.sw[i]; beep(300,40); } CIR.sel=i; drawCircuit(); }; });
  var msg = !r.bats?'ยังไม่มีแหล่งกำเนิดไฟฟ้า ใส่ถ่านไฟฉายก่อนนะ 🔋':r.open?'วงจรเปิด กระแสไฟฟ้ายังไหลไม่ครบรอบ (มีช่องว่าง หรือสวิตช์ปิดอยู่)':r.short?'⚠️ ลัดวงจร! ไม่มีอุปกรณ์ไฟฟ้าในวงจรเลย ถ่านจะร้อนและเสื่อมเร็ว':r.ledBurn?'💥 LED ขาด! ต้องต่อตัวต้านทานเพื่อจำกัดกระแสไฟฟ้า':
    '✨ วงจรปิด กระแสไฟฟ้าไหลครบรอบ'+(r.bulb?' · หลอดไฟสว่าง':'')+(r.led?' · LED ติด':'')+(r.buz?' · บัซเซอร์ดัง':'')+(r.mot?' · มอเตอร์หมุน':'');

  var done=sKey('cir')||{}, gained=false;
  $('#cirMis').innerHTML=MISSIONS.map(function(m,i){ var ok=m.ok(r); if(ok&&!done[i]){ done[i]=1; gained=true; } return '<div class="mis'+(done[i]?' ok':'')+'">'+(done[i]?'⭐':'☆')+' '+m.t+'</div>'; }).join('')+

}

/* ---------- 3) เรียงขั้นตอน EDP ---------- */
function gEdp(){
  var order=EDP.map(function(t,i){return i;}).sort(function(){return Math.random()-.5;}), next=0, t0=null, timer=null, miss=0;
  var best=sKey('edp');
  $('#app').innerHTML=gamePage('เรียงขั้นตอนกระบวนการออกแบบเชิงวิศวกรรม','reorder',
    botSays('<b>น้องบอทท้าแข่ง!</b> เรียงขั้นตอนวิศวกรตัวจิ๋วให้เร็วที่สุด 🏁','robot')+'<div class="small muted">กดการ์ดตามลำดับขั้นที่ 1 → 6 ให้เร็วที่สุด กดผิดจะถูกบวกเวลา 2 วินาที</div>'+
    '<div class="edp-top"><div class="kanit">⏱️ <span id="edT">0.0</span> วินาที</div><div class="small">สถิติดีที่สุด: <b id="edB">'+(best?best.toFixed(1)+' วินาที':'-')+'</b></div></div>'+
    '<div class="edp-cards">'+order.map(function(i){ return '<button class="edp-c" data-i="'+i+'" style="'+grad(UNIT_COLORS[i%6])+'">'+EDP[i]+'</button>'; }).join('')+'</div>'+
    '<div class="edp-line" id="edL"></div><div class="row-end"><button class="btn btn-ghost btn-sm" onclick="gEdp()">'+ic('restart_alt')+' เล่นใหม่</button></div>');
  document.querySelectorAll('.edp-c').forEach(function(b){ b.onclick=function(){
    if(!t0){ t0=performance.now(); timer=setInterval(function(){ $('#edT').textContent=((performance.now()-t0)/1000+miss*2).toFixed(1); },100); }
    if(+b.dataset.i===next){ b.classList.add('done'); b.disabled=true; $('#edL').innerHTML+='<span>'+(next+1)+'. '+EDP[next]+'</span>'; next++; beep(500+next*80,90,'sine');
      if(next===6){ clearInterval(timer); var sec=(performance.now()-t0)/1000+miss*2; $('#edT').textContent=sec.toFixed(1); confetti();
        if(!best||sec<best){ sKey('edp',sec); $('#edB').textContent=sec.toFixed(1)+' วินาที'; toast('สถิติใหม่! 🏆 '+sec.toFixed(1)+' วินาที'); } else toast('เก่งมาก! ครบ 6 ขั้นแล้ว 🎉'); } }
    else { miss++; b.classList.add('shake'); beep(150,150,'sawtooth'); setTimeout(function(){ b.classList.remove('shake'); },400); }
  }; });
}

      '<label class="small">บทละ</label><select id="plK"><option value="1">1 ครั้ง</option><option value="2">2 ครั้ง</option></select>'+
      '<button class="btn btn-ghost btn-sm" id="plA">'+ic('auto_awesome')+' จัดให้เลย</button></div><div class="small muted">ใช้วันสอนตามตารางสอน ข้ามวันหยุด · บทเรียนที่ต้องใช้หลายคาบ (เช่น โครงงาน) แก้วันเองได้หลังจัด</div></div>'+

function autoDates(room,start,max){
  var SC=S._sc, hol=holMap(), days=SC.timetable.filter(function(r){return r.room===room;}).map(function(r){return r.day;});
  var out=[], d=pd(start); if(!days.length) return out;
  for(var i=0;i<370&&out.length<max;i++){ var k=ymd(d); if(days.indexOf(DAYS[d.getDay()])>-1&&!hol[k]) out.push(k); d.setDate(d.getDate()+1); }
  return out;
}

    $('#asBody').innerHTML='<div class="card panel"><div class="filters"><select id="asR">'+roomOptions(D,S.asRoom)+'</select><input type="date" class="input" id="asD" value="'+esc(S.asDate)+'" style="max-width:180px">'+
      '<select id="asL"><option value="">- บทเรียน -</option>'+R.lessons.map(function(l){ return '<option value="'+esc(l.lessonId)+'"'+(l.lessonId===lesson?' selected':'')+'>'+esc(l.lessonId+' '+l.title)+'</option>'; }).join('')+'</select>'+

    var recalc=function(){ document.querySelectorAll('.as-tbl tr[data-t]').forEach(function(tr){ var a=[]; tr.querySelectorAll('.as-v').forEach(function(s){ if(s.value!=='') a.push(+s.value); s.style.background=s.value!==''?LV_COL[s.value]:'#fff'; }); tr.querySelector('.as-avg').textContent=a.length?(a.reduce(function(x,y){return x+y;},0)/a.length).toFixed(2):''; }); };

function asLevel(avg,F){ if(avg==null) return '-'; if(F.max===4) return avg>=3.5?'ดีมาก':avg>=2.5?'ดี':avg>=1.5?'พอใช้':'ปรับปรุง'; return avg>=2.5?'ดีเยี่ยม':avg>=1.5?'ดี':avg>=0.5?'ผ่าน':'ไม่ผ่าน'; }
function asSum(D){
  call('getAssessSummary',S.token,S.asRoom).then(function(R){
    S.asSumForm=S.asSumForm||'attr'; var F=R.forms[S.asSumForm];
    var mean=function(a){ a=a.filter(function(x){return x!=null;}); return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null; };
    var rows=R.students.map(function(s){ var a=s.f[S.asSumForm], m=mean(a);
      return [s.no||'',esc(s.name)].concat(a.map(function(v){return v==null?'-':v.toFixed(2);})).concat([m==null?'-':m.toFixed(2),'<b>'+asLevel(m,F)+'</b>']); });
    var cnt={}; R.students.forEach(function(s){ var l=asLevel(mean(s.f[S.asSumForm]),F); cnt[l]=(cnt[l]||0)+1; });
    var head=['เลขที่','ชื่อ-สกุล'].concat(F.items.map(function(x,i){return (i+1)+'. '+x;})).concat(['เฉลี่ย','ระดับ']);

      '<div class="small muted" style="margin-bottom:8px">'+(F.max===4?'เกณฑ์: 3.50 ขึ้นไป ดีมาก · 2.50–3.49 ดี · 1.50–2.49 พอใช้ · ต่ำกว่า 1.50 ปรับปรุง (คะแนนกลุ่มคิดให้สมาชิกทุกคน)':'เกณฑ์: 2.50 ขึ้นไป ดีเยี่ยม (3) · 1.50–2.49 ดี (2) · 0.50–1.49 ผ่าน (1) · ต่ำกว่า 0.50 ไม่ผ่าน (0)')+'</div>'+

function curIndText(code){
  var C=(S.home&&S.home.course)||{}, hit='';
  String(C['ตัวชี้วัด']||'').split('\n').forEach(function(l){ var p=l.split('|'); if(p.length>1 && p[0].replace(/\s/g,'').indexOf(code.replace(/\s/g,''))>=0) hit=p.slice(1).join('|').trim(); });
  return hit || CURRIC.ind[code] || '';
}
function curStd(){ var C=(S.home&&S.home.course)||{}; return C['มาตรฐานการเรียนรู้'] || CURRIC.standard; }
function curLessonTitle(id){ var L=(S.home&&S.home.lessons)||[]; for(var i=0;i<L.length;i++){ if(String(L[i].lessonId)===id) return L[i].title; } return (CURRIC.lessons[id]||{}).t||id; }
function curUnitTitle(uid){ var U=(S.home&&S.home.units)||[]; for(var i=0;i<U.length;i++){ if(String(U[i].unitId)===uid) return 'หน่วยที่ '+(i+1)+' '+U[i].title; } return uid; }

/* ---------- วิเคราะห์ข้อสอบ ---------- */
function pLvl(p){ return isNaN(p)?'-':p>.80?'ง่ายมาก':p>=.61?'ค่อนข้างง่าย':p>=.40?'ปานกลาง':p>=.20?'ค่อนข้างยาก':'ยากมาก'; }
function rLvl(r){ return isNaN(r)?'-':r>=.40?'ดีมาก':r>=.30?'ดี':r>=.20?'พอใช้':'ควรปรับปรุง'; }
function itemStats(items,recs){
  var M=recs.map(function(r){ return items.map(function(it,i){ return Number(r.ans[i])===it.key?1:0; }); });
  var tot=M.map(function(r){ return r.reduce(function(a,b){return a+b;},0); });
  var n=M.length, g=Math.max(1,Math.round(n*0.27));
  var order=tot.map(function(t,i){return [t,i];}).sort(function(a,b){return b[0]-a[0];});
  var hi=order.slice(0,g).map(function(x){return x[1];}), lo=order.slice(-g).map(function(x){return x[1];});
  var st=items.map(function(it,i){ var p=n?M.reduce(function(s,r){return s+r[i];},0)/n:NaN;
    var ru=hi.reduce(function(s,j){return s+M[j][i];},0), rl=lo.reduce(function(s,j){return s+M[j][i];},0);
    var r=n>=4?(ru-rl)/g:NaN; return {p:p,r:r,ok:p>=.2&&p<=.8&&r>=.2}; });
  var mean=n?tot.reduce(function(a,b){return a+b;},0)/n:NaN, vt=n?tot.reduce(function(s,x){return s+(x-mean)*(x-mean);},0)/n:NaN;
  var spq=st.reduce(function(s,x){return s+x.p*(1-x.p);},0), k=items.length;
  return {n:n,g:g,st:st,mean:mean,sd:Math.sqrt(vt),kr20:(k>1&&vt>0)?(k/(k-1))*(1-spq/vt):NaN};
}
function exAna(A){
  S.anaSrc=S.anaSrc||(A.tryoutCount?'TRY':'PRE');
  var opts=[['TRY','ผลทดลองใช้ 50 ข้อ ('+A.tryoutCount+' คน)']].concat(A.exams.map(function(e){ return [e.examId,e.title+' (ส่งแล้ว '+e.taken+' คน)']; }));
  $('#exBody').innerHTML='<div class="card panel"><div class="filters"><select id="anS">'+opts.map(function(o){ return '<option value="'+o[0]+'"'+(o[0]===S.anaSrc?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')+'</select><span class="grow"></span>'+
    '<button class="btn btn-ghost btn-sm" onclick="tryImport()">'+ic('upload')+' นำเข้าผลทดลองใช้</button></div>'+
    '<div class="box small">'+ic('lightbulb')+' <b>ขั้นตอนหาคุณภาพข้อสอบ</b> 1) นำข้อสอบ 50 ข้อ (พิมพ์จากแท็บคลังข้อสอบ) ไปทดลองใช้กับนักเรียนที่เคยเรียนเนื้อหานี้แล้ว เช่น ม.2 อย่างน้อย 30 คน 2) กด "นำเข้าผลทดลองใช้" วางคำตอบ 3) ระบบคำนวณค่าความยาก (p) อำนาจจำแนก (r) แบบกลุ่มสูง-ต่ำ 27% และค่าความเชื่อมั่น KR-20 4) กด "เลือก 30 ข้ออัตโนมัติ" ระบบเลือกข้อที่ผ่านเกณฑ์ตามสัดส่วนหน่วยใน blueprint</div><div id="anOut"><div class="empty">กำลังคำนวณ...</div></div></div>';
  $('#anS').onchange=function(){ S.anaSrc=this.value; exAna(A); };
  call('getExamAnalysis',S.token,S.anaSrc).then(function(R){
    S._ana=R;
    if(R.recs.length<4){ $('#anOut').innerHTML='<div class="empty">'+ic('hourglass_empty')+' ยังมีผู้สอบ '+R.recs.length+' คน ต้องมีอย่างน้อย 4 คน (แนะนำ 30 คนขึ้นไป) จึงจะวิเคราะห์ได้</div>'; return; }
    var X=itemStats(R.items,R.recs); S._anaX=X;

function autoPick(){

function gMatch(){

  pairs.forEach(function(t,i){ cards.push({id:i,f:'<span class="mt-e">'+t[0]+'</span>'+t[1],tool:1}); cards.push({id:i,f:t[2],tool:0}); });

    botSays('<b>ความจำดีแค่ไหนเอ่ย?</b> เปิดการ์ดทีละ 2 ใบ จับคู่เครื่องมือกับงานที่ใช้ 🛠️','hammer')+
    '<div class="edp-top"><div class="kanit">⏱️ <span id="mtT">0</span> วินาที</div><div class="kanit">👆 <span id="mtM">0</span> ครั้ง</div><div class="small">ดีที่สุด: <b>'+(best?best+' วินาที':'-')+'</b></div></div>'+
    '<div class="mt-grid">'+MT.cards.map(function(c,i){ return '<button class="mt-c" data-i="'+i+'"><div class="mt-in"><div class="mt-back">?</div><div class="mt-front'+(c.tool?' tool':'')+'">'+c.f+'</div></div></button>'; }).join('')+'</div>'+
    '<div class="row-end"><button class="btn btn-ghost btn-sm" onclick="clearInterval(MT.timer);gMatch()">'+ic('restart_alt')+' เล่นใหม่</button></div>');
  document.querySelectorAll('.mt-c').forEach(function(b){ b.onclick=function(){
    if(MT.lock||b.classList.contains('flip')) return;
    if(!MT.t0){ MT.t0=Date.now(); MT.timer=setInterval(function(){ var e=$('#mtT'); if(!e){ clearInterval(MT.timer); return; } e.textContent=Math.round((Date.now()-MT.t0)/1000); },500); }
    b.classList.add('flip'); MT.open.push(b); beep(520,40,'sine');

      var a=MT.cards[+MT.open[0].dataset.i], c=MT.cards[+MT.open[1].dataset.i];
      if(a.id===c.id){ MT.open.forEach(function(x){ x.classList.add('got'); }); MT.open=[]; MT.done++; beep(880,100,'sine');
        if(MT.done===8){ clearInterval(MT.timer); var sec=Math.round((Date.now()-MT.t0)/1000), best=sKey('match'); confetti();

      else { MT.lock=true; setTimeout(function(){ MT.open.forEach(function(x){ x.classList.remove('flip'); }); MT.open=[]; MT.lock=false; },800); }
    }
  }; });
}

/* ===================== อ่านออกเสียงให้ฟัง (สำหรับนักเรียนที่ยังอ่านไม่คล่อง) ===================== */
var TTS={ on: store('tts_on')==='1', rate: Number(store('tts_rate'))||0.9, q:[], busy:false, hl:null, ok:('speechSynthesis' in window) };
function ttsVoice(){
  if(!TTS.ok) return null;
  var v=speechSynthesis.getVoices().filter(function(x){ return /^th/i.test(x.lang); });
  // ใช้เฉพาะเสียงผู้หญิง (เช่น Premwadee, Pattara, Kanya, Narisa, Google ไทย) ไม่ใช้เสียงผู้ชาย (Niwat)
  v=v.filter(function(x){ return !/niwat|\bmale\b|ผู้ชาย/i.test(x.name); });
  v.sort(function(a,b){ var s=function(x){ return (/premwadee|natural/i.test(x.name)?4:0)+(/kanya|narisa|pattara|google|female|ผู้หญิง/i.test(x.name)?2:0); }; return s(b)-s(a); });
  return v[0]||null;
}
if(TTS.ok){ speechSynthesis.onvoiceschanged=function(){}; speechSynthesis.getVoices(); }
/* ดึงข้อความจาก element โดยตัดชื่อไอคอน ช่องกรอก และปุ่มลบออก */
function ttsText(el){
  var c=el.cloneNode(true);
  c.querySelectorAll('.ms,svg,input,textarea,select,script,style,.tts-skip').forEach(function(x){ x.remove(); });
  c.querySelectorAll('*').forEach(function(x){ x.after(' '); });
  return (c.textContent||'').replace(/[•·|]/g,' ').replace(/\s+/g,' ').trim()
    .replace(/^([ก-ง])\s+(?=\S)/,'ตัวเลือก $1. ').replace(/^(\d+)\.$/,'ข้อ $1').replace(/^(\d+)\.\s/,'ข้อ $1. ');
}
function ttsChunks(t,max){
  max=max||170; var out=[], parts=String(t).split(/(?<=[.!?…:])\s+|\n+/);
  parts.forEach(function(p){
    p=p.trim(); if(!p) return;
    while(p.length>max){ var cut=p.lastIndexOf(' ',max); if(cut<max*0.4) cut=max; out.push(p.slice(0,cut)); p=p.slice(cut).trim(); }
    if(p) out.push(p);
  });
  return out;
}
function ttsMark(el){ if(TTS.hl) TTS.hl.classList.remove('tts-hl'); TTS.hl=el||null; if(el){ el.classList.add('tts-hl'); var r=el.getBoundingClientRect(); if(r.top<70||r.bottom>innerHeight-90) el.scrollIntoView({behavior:'smooth',block:'center'}); } }
function ttsStop(){ TTS.q=[]; TTS.busy=false; TTS.pre={}; if(TTS.ok) speechSynthesis.cancel(); if(TTS.audio){ var a=TTS.audio; TTS.audio=null; a.onerror=null; a.onended=null; a.pause(); } ttsMark(null); ttsBarState(); }
/* items = [{text, el}] อ่านต่อกันตามลำดับ */
function ttsPlay(items){
  ttsStop();
  var mx=ttsVoice()?170:95; // เสียงออนไลน์รับข้อความสั้นกว่า
  items.forEach(function(it){ ttsChunks(it.text,mx).forEach(function(c,i){ TTS.q.push({text:c, el:i===0?it.el:null, keep:it.el}); }); });
  TTS.busy=true; ttsBarState(); ttsNext();
}
function ttsNext(){
  var it=TTS.q.shift();
  if(!it){ TTS.busy=false; ttsMark(null); ttsBarState(); return; }
  if(it.keep) ttsMark(it.keep);
  var v=ttsVoice();
  if(v){
    var u=new SpeechSynthesisUtterance(it.text);
    u.lang='th-TH'; u.voice=v; u.rate=TTS.rate; u.pitch=1.05;
    u.onend=function(){ if(TTS.busy) ttsNext(); };
    u.onerror=function(e){ if(e.error!=='interrupted'&&e.error!=='canceled'&&TTS.busy) ttsNext(); };
    speechSynthesis.speak(u); return;
  }
  ttsNet(it.text);
}
/* เครื่องที่ไม่มีเสียงไทย (เช่น Chrome บน Windows): ใช้เสียงผู้หญิงภาษาไทยออนไลน์ */
function ttsUrl(t){ return 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=th&total=1&idx=0&textlen='+t.length+'&q='+encodeURIComponent(t); }
TTS.pre={};
function ttsPrefetch(){ var n=TTS.q[0]; if(n && !TTS.pre[n.text] && !TTS.useServer){ var a=new Audio(); a.preload='auto'; a.src=ttsUrl(n.text); TTS.pre[n.text]=a; } }
function ttsNet(text){
  var tries=0, a;
  var done=function(){ if(TTS.audio===a && TTS.busy){ delete TTS.pre[text]; ttsNext(); } };
  var fromServer=function(){
    if(!IS_GAS && !API_URL){ done(); return; }
    api('ttsAudio',text).then(function(b64){ if(TTS.audio!==a||!TTS.busy) return; a.onerror=done; a.src='data:audio/mpeg;base64,'+b64; a.playbackRate=TTS.rate<0.85?0.8:1; a.play().catch(done); })
      .catch(function(){ if(!TTS.warned){ TTS.warned=1; toast('โหลดเสียงบางประโยคไม่ได้ ตรวจสอบอินเทอร์เน็ต',true); } done(); });
  };
  a = (!TTS.useServer && TTS.pre[text]) || new Audio();
  TTS.audio=a;
  a.onended=done;
  a.onerror=function(){ tries++; if(tries===1){ TTS.useServer=true; fromServer(); } else done(); };
  if(TTS.useServer){ fromServer(); }
  else { if(!a.src) a.src=ttsUrl(text); a.playbackRate=TTS.rate<0.85?0.8:1; var pr=a.play(); if(pr&&pr.catch) pr.catch(function(e){ if(e&&e.name==='NotAllowedError'){ toast('แตะหน้าจอ 1 ครั้ง แล้วกดฟังอีกครั้งนะ',true); ttsStop(); } else a.onerror(); }); }
  ttsPrefetch();
}
function ttsSay(text,el){ if(text) ttsPlay([{text:text,el:el}]); }
/* อ่านทั้งหน้า: หัวข้อ ย่อหน้า รายการ ตัวเลือก ตามลำดับบนหน้า */
var TTS_BLOCK='h1,h2,h3,h4,h5,p,li,label,blockquote,td,th,.pl-t,.ce-sub,.reply,.opt,.choice,.q-text';
function ttsReadPage(){
  var root=document.querySelector('.modal-bg .modal')||document.querySelector('#app .page')||document.querySelector('#app main')||document.getElementById('app');
  var els=[].slice.call(root.querySelectorAll(TTS_BLOCK)).filter(function(e){
    if(e.closest('.topbar,footer,.tts-bar,.tts-skip,.tside')) return false;
    if(e.offsetParent===null) return false;
    var p=e.parentElement && e.parentElement.closest(TTS_BLOCK); return !(p && root.contains(p));
  });
  var items=els.map(function(e){ return {text:ttsText(e), el:e}; }).filter(function(x){ return x.text.length>1; });
  if(!items.length){ toast('หน้านี้ไม่มีข้อความให้อ่าน'); return; }
  ttsPlay(items);
}
/* ลากเมาส์คลุมข้อความ (หรือกดค้างเลือกข้อความบนมือถือ) แล้วอ่านส่วนที่เลือก */
function ttsSel(){
  var sel=window.getSelection&&window.getSelection(); if(!sel||sel.isCollapsed||!sel.rangeCount) return '';
  var d=document.createElement('div'); for(var i=0;i<sel.rangeCount;i++) d.appendChild(sel.getRangeAt(i).cloneContents());
  var t=ttsText(d); return t.length>1?t:''; // ตัดชื่อไอคอนออก
}
function ttsReadSel(){
  if(!TTS.on) return false;
  var t=ttsSel(); if(!t) return false;
  if(t===TTS.lastSel && Date.now()-(TTS.selAt||0)<1500) return true;
  TTS.lastSel=t; TTS.selAt=Date.now();
  ttsPlay([{text:t, el:null}]);
  return true;
}
document.addEventListener('mouseup',function(e){ if(e.target.closest&&e.target.closest('.tts-bar,.tts-fab,input,textarea')) return; setTimeout(ttsReadSel,10); });
document.addEventListener('touchend',function(){ setTimeout(ttsReadSel,350); });
document.addEventListener('selectionchange',function(){ if(!TTS.on || !('ontouchstart' in window)) return; clearTimeout(TTS.selT); TTS.selT=setTimeout(ttsReadSel,800); });
/* แตะข้อความเพื่อฟัง (เมื่อเปิดโหมดอ่านให้ฟัง) */
document.addEventListener('click',function(e){
  if(!TTS.on) return;
  if(ttsSel() || Date.now()-(TTS.selAt||0)<400) return; // กำลังลากเลือกข้อความอยู่ ใช้การอ่านส่วนที่เลือกแทน

  var t=e.target;
  if(t.closest('.tts-bar,.tts-fab,input,textarea,select,.topbar,.tside')) return;
  var el=t.closest(TTS_BLOCK+',button,.btn,.chip,.small,.muted,.pick-l,.card h3');
  if(!el || !el.closest('#app,.modal-bg')) return;
  var txt=ttsText(el); if(txt.length<1) return;
  ttsSay(txt,el);
},true);
function ttsToggle(){
  TTS.on=!TTS.on; store('tts_on',TTS.on?'1':'0');
  if(!TTS.on){ ttsStop(); toast('ปิดเสียงอ่านแล้ว'); }
  else { toast('เปิดเสียงอ่านแล้ว แตะข้อความที่อยากฟังได้เลย'); ttsSay('เปิดเสียงอ่านแล้ว แตะข้อความ หรือลากเมาส์คลุมข้อความที่อยากฟัง หรือกดปุ่ม อ่านทั้งหน้า'); }
  ttsUI();
}
function ttsRate(){ TTS.rate = TTS.rate<0.85?0.95:0.75; store('tts_rate',String(TTS.rate)); ttsBarState(); toast(TTS.rate<0.85?'อ่านช้าลง':'อ่านความเร็วปกติ'); }
function ttsBarState(){
  var b=document.getElementById('ttsBar'); if(!b) return;
  b.querySelector('#ttsPlay').innerHTML=TTS.busy?ic('stop_circle')+'<span>หยุด</span>':ic('record_voice_over')+'<span>อ่านทั้งหน้า</span>';
  b.querySelector('#ttsSpd').innerHTML=ic(TTS.rate<0.85?'slow_motion_video':'speed')+'<span>'+(TTS.rate<0.85?'ช้า':'ปกติ')+'</span>';
}
function ttsUI(){
  var f=document.getElementById('ttsFab'), b=document.getElementById('ttsBar');
  if(!f){ f=document.createElement('button'); f.id='ttsFab'; f.className='tts-fab'; f.onclick=ttsToggle; document.body.appendChild(f); }
  var teacher=S.user&&S.user.role==='teacher'; f.style.display=teacher?'none':'';
  f.classList.toggle('on',TTS.on);
  f.innerHTML=ic(TTS.on?'volume_up':'volume_off')+'<span>'+(TTS.on?'เสียงอ่าน: เปิด':'อ่านให้ฟัง')+'</span>';
  f.title=TTS.on?'ปิดเสียงอ่าน':'เปิดเสียงอ่าน (สำหรับคนที่อยากฟังแทนการอ่าน)';
  if(TTS.on && !teacher){
    if(!b){ b=document.createElement('div'); b.id='ttsBar'; b.className='tts-bar';
      b.innerHTML='<div class="tts-hint">'+ic('touch_app')+' แตะ หรือลากเมาส์คลุมข้อความที่อยากฟัง</div><button id="ttsPlay" onclick="TTS.busy?ttsStop():ttsReadPage()"></button><button id="ttsSpd" onclick="ttsRate()"></button>';
      document.body.appendChild(b); }
    b.style.display=''; ttsBarState();
  } else if(b){ b.style.display='none'; }
}
window.addEventListener('hashchange',function(){ ttsStop(); setTimeout(ttsUI,50); });
setTimeout(ttsUI,300);

function tlRound(){
  $('#tlH').textContent='❤️'.repeat(TL.hp)+'🤍'.repeat(3-TL.hp);

  if(!set||TL.hp<=0){ var win=TL.hp>0, best=sKey('timeline')||0; if(TL.score>best) sKey('timeline',TL.score); if(win) confetti();

    '<div class="mg-opts">'+items.map(function(x){ return '<button class="mg-o tl-o" data-k="'+x.k+'"><span>'+x.e+'</span>'+esc(x.t)+'</button>'; }).join('')+'</div><div id="tlF"></div>';
  document.querySelectorAll('.tl-o').forEach(function(b){ b.onclick=function(){
    var k=+b.dataset.k;
    if(k===TL.next){ b.disabled=true; b.classList.add('ok'); $('#tlSlot'+k).innerHTML='<b>'+set[1][k][0]+'</b><small>'+esc(set[1][k][1])+'</small>'; $('#tlSlot'+k).classList.add('on'); TL.next++; TL.score+=5; beep(660+k*120,90,'sine');

        $('#tlNext').onclick=function(){ TL.i++; tlRound(); }; }
